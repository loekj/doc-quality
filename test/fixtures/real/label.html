<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d0d0f">
<title>doc-quality · label</title>
<style>
  /*
    Grading 5000 images is a thumb-endurance problem, so the layout is built
    around one rule: the thing you press thousands of times sits where the thumb
    already is, and takes one press.
  */
  :root {
    --bg: #0d0d0f;
    --panel: #17171b;
    --line: #2a2a31;
    --text: #eaeaef;
    --dim: #8b8b96;
    --accent: #5b8cff;
    --vbad: #ff5c5c;
    --bad: #ffb020;
    --mid: #d8c85a;
    --good: #8ad55f;
    --vgood: #35d07f;
    --tap: 60px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior: none; }
  body {
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    /* dvh, not vh: mobile browser chrome makes vh taller than the visible area,
       which pushed the buttons under the address bar. */
    height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── top bar ─────────────────────────────────────────────── */
  #bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
         padding-top: calc(8px + env(safe-area-inset-top, 0px));
         background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0; }
  #meter { flex: 1; height: 6px; background: #24242b; border-radius: 3px; overflow: hidden; }
  #meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  #count { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #queue { font-size: 12px; color: var(--bad); display: none; white-space: nowrap; }
  #queue.show { display: block; }
  #mode { min-width: 52px; min-height: 32px; background: #23232a; border: 1px solid var(--line);
          color: var(--dim); border-radius: 8px; font-size: 12px; font-weight: 700; }
  #mode.fine { background: #23386b; border-color: var(--accent); color: #bcd0ff; }

  /* ── image ───────────────────────────────────────────────── */
  #stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
           overflow: hidden; min-height: 0; background: #000; touch-action: pan-y; }
  #stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #stage iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  #hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
          color: var(--dim); font-size: 15px; pointer-events: none; }
  #meta { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 8px;
          align-items: center; font-size: 12px; color: var(--dim); pointer-events: none; }
  #meta b { background: rgba(0,0,0,.72); padding: 5px 9px; border-radius: 6px; color: #cfcfd8;
            font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #prev-label { background: rgba(0,0,0,.72); padding: 5px 9px; border-radius: 6px; font-weight: 600; }
  #zoom { position: absolute; right: 10px; bottom: 10px; width: 46px; height: 46px; border-radius: 12px;
          background: rgba(0,0,0,.6); border: 1px solid #3a3a44; color: #d8d8e0; font-size: 19px;
          display: flex; align-items: center; justify-content: center; }

  /* ── controls ────────────────────────────────────────────── */
  #panel { flex-shrink: 0; background: var(--panel); border-top: 1px solid var(--line);
           padding: 8px 10px calc(8px + var(--safe-b)); }
  .row { display: flex; gap: 6px; }
  .row + .row { margin-top: 6px; }

  /* The four scores. One press each — this is the whole job. */
  #tiers { display: grid; gap: 6px; }
  #tiers.n4 { grid-template-columns: repeat(4, 1fr); }
  #tiers.n5 { grid-template-columns: repeat(5, 1fr); }
  /* 0-100 mode: the same thumb zone, spent on precision instead of speed. */
  #scale input { width: 100%; height: 44px; accent-color: var(--accent); }
  #scale-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  #bigval { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 76px; }
  #bigtier { flex: 1; font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 7px; text-align: center; }
  #bigtier[data-t="very-bad"] { background: #4a1a1a; color: var(--vbad); }
  #bigtier[data-t="bad"]      { background: #4a3714; color: var(--bad); }
  #bigtier[data-t="good"]     { background: #23401a; color: var(--good); }
  #bigtier[data-t="very-good"]{ background: #12402a; color: var(--vgood); }
  #bigsave { flex: 0 0 124px; background: var(--accent); color: #fff; }
  .tier { min-height: var(--tap); border: 0; border-radius: 12px; font-size: 14px; font-weight: 700;
          color: #10100f; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 1px; line-height: 1.1; }
  .tier small { font-size: 10px; font-weight: 600; opacity: .62; }
  .tier:active { transform: scale(.95); filter: brightness(1.15); }
  /* Five buttons still clear the 44px floor on a 375px phone: 66px each. */
  #tiers.n5 .tier { font-size: 13px; }

  .btn { min-height: 46px; flex: 1; background: #23232a; border: 1px solid var(--line); color: var(--text);
         border-radius: 10px; font-size: 14px; font-weight: 600; }
  .btn:active { background: #2e2e37; }
  .btn.wide { flex: 2; }
  .btn:disabled { opacity: .35; }
  .btn.on { background: #23386b; border-color: var(--accent); color: #bcd0ff; }

  /* Everything below is optional and folded away by default, because the
     four buttons above are the only thing most images need. */
  #more { display: none; margin-top: 6px; }
  #more.open { display: block; }
  #cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .chip { min-height: 44px; background: #23232a; border: 1px solid var(--line); color: var(--dim);
          border-radius: 9px; font-size: 13px; font-weight: 600; }
  .chip.on { background: #23386b; border-color: var(--accent); color: #bcd0ff; }
  #tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .tag { min-height: 44px; padding: 0 14px; background: #23232a; border: 1px solid var(--line);
         color: var(--dim); border-radius: 18px; font-size: 13px; }
  .tag.on { background: #4a3714; border-color: #c9900f; color: #ffc93c; }
  #fine { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  #fine input { flex: 1; accent-color: var(--accent); height: 30px; }
  #fine b { font-variant-numeric: tabular-nums; min-width: 42px; text-align: center; font-size: 15px; }
  #notes { width: 100%; margin-top: 6px; background: #1d1d23; border: 1px solid var(--line);
           color: var(--text); border-radius: 9px; padding: 11px; font-size: 16px; }
  #notes:focus { outline: none; border-color: var(--accent); }

  kbd { display: none; }
  @media (min-width: 820px) and (hover: hover) {
    kbd { display: inline-block; background: #2a2a33; border: 1px solid #3c3c47; border-radius: 4px;
          padding: 0 5px; font-size: 10px; color: var(--dim); margin-left: 5px; font-family: inherit; }
    .tier:hover, .btn:hover, .chip:hover, .tag:hover { filter: brightness(1.12); }
  }

  /* ── flash + zoom ────────────────────────────────────────── */
  #flash { position: fixed; left: 50%; bottom: calc(50% - 20px); transform: translateX(-50%);
           padding: 9px 20px; border-radius: 10px; font-size: 14px; font-weight: 700; opacity: 0;
           transition: opacity .12s; pointer-events: none; z-index: 60; background: rgba(91,140,255,.94); }
  #flash.show { opacity: 1; }
  #flash.bad { background: rgba(200,54,54,.95); }

  #zoomer { display: none; position: fixed; inset: 0; z-index: 100; background: #000; touch-action: none; }
  #zoomer.on { display: block; }
  #zoomer img { position: absolute; transform-origin: 0 0; }
  #zclose { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 101;
            width: 46px; height: 46px; border-radius: 23px; background: rgba(0,0,0,.7);
            border: 1px solid #3a3a44; color: #fff; font-size: 22px; }
</style>
</head>
<body>

<div id="bar">
  <div id="meter"><i></i></div>
  <span id="count">…</span>
  <span id="queue"></span>
  <button id="mode" title="Switch scoring mode">1-4</button>
</div>

<div id="stage">
  <div id="hint">Loading…</div>
  <img id="pic" alt="" hidden>
  <iframe id="pdf" hidden></iframe>
  <div id="meta"><b id="path"></b><span id="prev-label" hidden></span></div>
  <button id="zoom" hidden aria-label="Zoom">⤢</button>
</div>

<div id="panel">
  <div id="scale" hidden>
    <input type="range" id="big" min="0" max="100" step="1" value="62">
    <div id="scale-row">
      <b id="bigval">0.62</b>
      <span id="bigtier">good</span>
      <button class="tier" id="bigsave" data-t="save">Save<small>Enter</small></button>
    </div>
  </div>
  <div id="tiers"></div>
  <div class="row">
    <button class="btn" id="undo" disabled>Undo<kbd>U</kbd></button>
    <button class="btn wide" id="skip">Skip<kbd>S</kbd></button>
    <button class="btn" id="toggle">Detail</button>
  </div>
  <div id="more">
    <div id="cats">
      <button class="chip" data-c="document">Doc</button>
      <button class="chip" data-c="receipt">Receipt</button>
      <button class="chip" data-c="card">Card</button>
      <button class="chip" data-c="photo">Photo</button>
    </div>
    <div id="tags"></div>
    <div id="fine">
      <input type="range" id="slider" min="0" max="100" step="1" value="62">
      <b id="sval">0.62</b>
      <button class="btn" id="save-fine" style="flex:0 0 90px">Save</button>
    </div>
    <input id="notes" type="text" placeholder="Notes (optional)" autocomplete="off">
  </div>
</div>

<div id="flash"></div>
<div id="zoomer"><img id="zimg" alt=""></div>
<button id="zclose" hidden>×</button>

<script>
const ISSUES = ['Blurry','Too dark','Too bright','Glare','Moire','Tilted','Shadows',
                'Low res','Compressed','Faded text','Motion blur','Noisy','Partial/cropped'];
const DIR_TO_CATEGORY = { documents:'document', receipts:'receipt', cards:'card', photos:'photo' };
/*
  The scales, as data.

  Four bands match the tier names used everywhere else — the fixture folders,
  TIER_LABELS in extract-features.mjs, the per-tier buckets in train-model.py —
  and their centres are those tier defaults.

  Five bands add the judgement the four cannot express: this one is borderline.
  Its centre is 0.48, not 0.50, and that is deliberate. train-model.py decides
  pass with `y_true >= threshold`, so a label sitting exactly on 0.5 is scored
  as a definite pass, and every borderline call would quietly become a positive
  in the metrics. Placing it just below keeps a borderline page on the fail
  side, which is the safe direction for a gate whose entire job is to avoid
  paying for a page that will not read.
*/
const SCALES = {
  bands4: {
    id: 'bands4', label: '1-4',
    steps: [
      { t: 'very-bad',  s: 0.12, name: 'Unusable' },
      { t: 'bad',       s: 0.37, name: 'Bad' },
      { t: 'good',      s: 0.62, name: 'Good' },
      { t: 'very-good', s: 0.87, name: 'Great' },
    ],
  },
  bands5: {
    id: 'bands5', label: '1-5',
    steps: [
      { t: 'very-bad',  s: 0.10, name: 'Unusable' },
      { t: 'bad',       s: 0.30, name: 'Bad' },
      { t: 'marginal',  s: 0.48, name: 'Marginal' },
      { t: 'good',      s: 0.70, name: 'Good' },
      { t: 'very-good', s: 0.90, name: 'Great' },
    ],
  },
  fine: { id: 'fine', label: '0-100', steps: null },
};
const SCALE_ORDER = ['bands4', 'bands5', 'fine'];
const TIER_COLOR = {
  'very-bad': 'var(--vbad)', bad: 'var(--bad)', marginal: 'var(--mid)',
  good: 'var(--good)', 'very-good': 'var(--vgood)',
};
const PREFETCH = 3;

const $ = (id) => document.getElementById(id);
let images = [], at = 0, category = 'document', issues = new Set(), open = false;
/* Two ways to score the same thing. The four bands are faster; the 0-100 scale
   is what the earlier tool used and what the labels already in the file were
   graded on. Both write an identical record, and the band edges are the same
   0.25 / 0.50 / 0.75, so a session can switch mid-way without the dataset
   becoming two incompatible halves. */
let scaleId = SCALE_ORDER.includes(localStorage.getItem('dq-scale'))
  ? localStorage.getItem('dq-scale') : 'bands4';
const isFine = () => scaleId === 'fine';
let back = [];            // indices we came from, for Undo
const prefetched = new Map();

/* ── save queue ──────────────────────────────────────────────
   A grading session on a phone will drop connection. Saves go into a queue
   that retries, so a label is never lost to a dead lift moment — the previous
   version fired a POST and forgot about it if it failed. */
const pending = [];
let flushing = false;

function enqueue(body) {
  pending.push(body);
  paintQueue();
  flush();
}

async function flush() {
  if (flushing || pending.length === 0) return;
  flushing = true;
  while (pending.length) {
    const body = pending[0];
    try {
      const res = await fetch('/api/label', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(res.status);
      pending.shift();
      paintQueue();
    } catch {
      flushing = false;
      paintQueue();
      setTimeout(flush, 2500);   // keep trying; the label stays queued
      return;
    }
  }
  flushing = false;
  paintQueue();
}
function paintQueue() {
  const q = $('queue');
  q.textContent = pending.length ? `${pending.length} unsaved` : '';
  q.classList.toggle('show', pending.length > 0);
}
/* Last line of defence: warn before the tab closes with work in flight. */
addEventListener('beforeunload', (e) => { if (pending.length) { e.preventDefault(); e.returnValue = ''; } });

/* ── data ────────────────────────────────────────────────── */
async function load() {
  const res = await fetch('/api/images');
  images = await res.json();
  if (!images.length) { $('hint').textContent = 'No images found.'; return; }
  paintTags();
  const first = images.findIndex((i) => !i.label);
  show(first >= 0 ? first : 0);
}

function urlFor(i) { return '/api/image/' + encodeURIComponent(i.path); }

/* Fetch the next few so a tap does not wait on the network. */
function prefetch(from) {
  for (let n = 1; n <= PREFETCH; n++) {
    const i = images[from + n];
    if (!i || prefetched.has(i.path) || i.path.toLowerCase().endsWith('.pdf')) continue;
    const im = new Image();
    im.src = urlFor(i);
    prefetched.set(i.path, im);
  }
  if (prefetched.size > 24) {
    for (const k of [...prefetched.keys()].slice(0, 12)) prefetched.delete(k);
  }
}

function show(idx) {
  if (idx < 0 || idx >= images.length) return;
  at = idx;
  issues.clear();
  const img = images[idx];
  const isPdf = img.path.toLowerCase().endsWith('.pdf');

  $('hint').hidden = false;
  $('hint').textContent = 'Loading…';
  $('pic').hidden = true;
  $('pdf').hidden = true;
  $('zoom').hidden = isPdf;

  if (isPdf) {
    $('pdf').src = urlFor(img);
    $('pdf').hidden = false;
    $('hint').hidden = true;
  } else {
    const el = $('pic');
    el.onload = () => { el.hidden = false; $('hint').hidden = true; };
    el.onerror = () => { $('hint').textContent = 'Could not load this image.'; };
    el.src = urlFor(img);
    if (el.complete && el.naturalWidth) { el.hidden = false; $('hint').hidden = true; }
  }

  $('path').textContent = img.path;
  category = (img.label && img.label.category) || DIR_TO_CATEGORY[img.category] || 'document';
  $('notes').value = (img.label && img.label.notes) || '';
  if (img.label && Array.isArray(img.label.issues)) issues = new Set(img.label.issues);

  const prev = $('prev-label');
  if (img.label) {
    const s = img.label.score;
    prev.hidden = false;
    prev.textContent = img.label.label + (s == null ? '' : ' ' + s.toFixed(2));
      prev.style.color = TIER_COLOR[img.label.label] || '#8b8b96';
    const pos = Math.round((s ?? 0.5) * 100);
    $('slider').value = pos;
    $('big').value = pos;
  } else {
    prev.hidden = true;
    $('slider').value = 62;
    $('big').value = 62;
  }
  paintFine(); paintBig(); paintCats(); paintTags(); paintProgress();
  $('undo').disabled = back.length === 0;
  prefetch(idx);
}

function nextUnlabelled() {
  for (let i = at + 1; i < images.length; i++) if (!images[i].label) return show(i);
  for (let i = 0; i < images.length; i++) if (!images[i].label) return show(i);
  $('hint').textContent = 'Every image has a label. Nice.';
}

/* ── grading ─────────────────────────────────────────────── */
function grade(tier, score) {
  const img = images[at];
  if (!img) return;
  const body = {
    path: img.path, label: tier,
    score: score ?? 0.5,
    category, issues: [...issues], notes: $('notes').value.trim(),
  };
  img.label = { ...body, timestamp: new Date().toISOString() };
  enqueue(body);
  flash(tier === 'skip' ? 'skipped' : `${tier} ${body.score.toFixed(2)}`);
  back.push(at);
  if (back.length > 50) back.shift();
  paintProgress();
  nextUnlabelled();
}

/* Undo steps back and clears the label, so a mis-tap costs one press. */
function undo() {
  const idx = back.pop();
  if (idx == null) return;
  const img = images[idx];
  if (img) {
    img.label = null;
    enqueue({ path: img.path, label: 'unlabeled', score: null, category, issues: [], notes: '' });
  }
  flash('undone');
  show(idx);
}

function tierOf(v) {
  return v < 0.25 ? 'very-bad' : v < 0.5 ? 'bad' : v < 0.75 ? 'good' : 'very-good';
}

function paintMode() {
  const scale = SCALES[scaleId];
  const bands = scale.steps;
  $('tiers').hidden = !bands;
  $('scale').hidden = Boolean(bands);
  $('mode').textContent = scale.label;
  $('mode').classList.toggle('fine', !bands);
  $('fine').style.display = bands ? '' : 'none';  // no second slider in scale mode

  const row = $('tiers');
  row.className = bands ? 'n' + bands.length : '';
  row.innerHTML = '';
  (bands ?? []).forEach((step, i) => {
    const b = document.createElement('button');
    b.className = 'tier';
    b.style.background = TIER_COLOR[step.t] || '#888';
    b.innerHTML = `${step.name}<small>${i + 1}</small>`;
    b.onclick = () => grade(step.t, step.s);
    row.appendChild(b);
  });
  paintBig();
}

function paintBig() {
  const v = $('big').valueAsNumber / 100;
  $('bigval').textContent = v.toFixed(2);
  const t = tierOf(v);
  $('bigtier').textContent = t;
  $('bigtier').dataset.t = t;
}

/* ── painting ────────────────────────────────────────────── */
function paintProgress() {
  const done = images.filter((i) => i.label).length;
  $('count').textContent = `${done}/${images.length}`;
  $('meter').firstElementChild.style.width = (100 * done / images.length) + '%';
}
function paintCats() {
  document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c.dataset.c === category));
}
function paintTags() {
  const box = $('tags');
  box.innerHTML = '';
  for (const name of ISSUES) {
    const b = document.createElement('button');
    b.className = 'tag' + (issues.has(name) ? ' on' : '');
    b.textContent = name;
    b.onclick = () => { issues.has(name) ? issues.delete(name) : issues.add(name); paintTags(); };
    box.appendChild(b);
  }
}
function paintFine() {
  const v = $('slider').valueAsNumber / 100;
  $('sval').textContent = v.toFixed(2);
}
function flash(text, bad) {
  const f = $('flash');
  f.textContent = text;
  f.classList.toggle('bad', !!bad);
  f.classList.add('show');
  clearTimeout(flash._t);
  flash._t = setTimeout(() => f.classList.remove('show'), 550);
}

/* ── input ───────────────────────────────────────────────── */
document.querySelectorAll('.chip').forEach((c) => {
  c.onclick = () => { category = c.dataset.c; paintCats(); };
});
$('skip').onclick = () => grade('skip', 0);
$('undo').onclick = undo;
$('toggle').onclick = () => {
  open = !open;
  $('more').classList.toggle('open', open);
  $('toggle').classList.toggle('on', open);
};
$('slider').oninput = paintFine;
$('big').oninput = paintBig;
$('bigsave').onclick = () => {
  const v = $('big').valueAsNumber / 100;
  grade(tierOf(v), v);
};
$('mode').onclick = () => {
  scaleId = SCALE_ORDER[(SCALE_ORDER.indexOf(scaleId) + 1) % SCALE_ORDER.length];
  localStorage.setItem('dq-scale', scaleId);
  paintMode();
  flash(SCALES[scaleId].label);
};
$('save-fine').onclick = () => {
  const v = $('slider').valueAsNumber / 100;
  grade(tierOf(v), v);
};

/* Swipe to move between images — the gesture a phone already expects. */
let sx = 0, sy = 0, swiping = false;
$('stage').addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiping = true;
}, { passive: true });
$('stage').addEventListener('touchend', (e) => {
  if (!swiping) return;
  swiping = false;
  const t = e.changedTouches[0];
  const dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  if (dx < 0) nextUnlabelled(); else undo();
}, { passive: true });

addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') {
    if (e.key === 'Enter') e.target.blur();
    return;
  }
  const bands = SCALES[scaleId].steps;
  const n = Number(e.key);
  if (bands && n >= 1 && n <= bands.length) {
    e.preventDefault();
    return grade(bands[n - 1].t, bands[n - 1].s);
  }
  if (e.key === 'Enter' && isFine()) {
    e.preventDefault();
    const v = $('big').valueAsNumber / 100;
    return grade(tierOf(v), v);
  }
  switch (e.key) {
    case 's': case 'S': e.preventDefault(); grade('skip', 0); break;
    case 'u': case 'U': case 'ArrowLeft': e.preventDefault(); undo(); break;
    case 'ArrowRight': e.preventDefault(); nextUnlabelled(); break;
    case 'z': case 'Z': e.preventDefault(); openZoom(); break;
    case 'd': case 'D': e.preventDefault(); $('toggle').click(); break;
    case 'Escape': closeZoom(); break;
  }
});

/* ── zoom ────────────────────────────────────────────────── */
let zs = 1, zx = 0, zy = 0;
function openZoom() {
  const img = images[at];
  if (!img || img.path.toLowerCase().endsWith('.pdf')) return;
  $('zimg').src = urlFor(img);
  $('zoomer').classList.add('on');
  $('zclose').hidden = false;
  zs = 1; zx = 0; zy = 0; applyZoom();
}
function closeZoom() { $('zoomer').classList.remove('on'); $('zclose').hidden = true; }
function applyZoom() { $('zimg').style.transform = `translate(${zx}px,${zy}px) scale(${zs})`; }
$('zoom').onclick = openZoom;
$('zclose').onclick = closeZoom;
$('pic').onclick = () => { if (matchMedia('(hover: none)').matches) openZoom(); };
$('zoomer').addEventListener('wheel', (e) => {
  e.preventDefault();
  zs = Math.min(8, Math.max(1, zs * (e.deltaY < 0 ? 1.15 : 0.87)));
  applyZoom();
}, { passive: false });

let pinch = 0, panX = 0, panY = 0;
$('zoomer').addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  } else if (e.touches.length === 1) { panX = e.touches[0].clientX - zx; panY = e.touches[0].clientY - zy; }
}, { passive: true });
$('zoomer').addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 2 && pinch) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    zs = Math.min(8, Math.max(1, zs * (d / pinch)));
    pinch = d;
  } else if (e.touches.length === 1) { zx = e.touches[0].clientX - panX; zy = e.touches[0].clientY - panY; }
  applyZoom();
}, { passive: false });

paintMode();
load();
</script>
</body>
